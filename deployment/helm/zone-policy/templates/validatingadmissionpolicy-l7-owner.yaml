{{- /*
One L7 owner per path (SRS 2.3.3, Table 4: L7 policies MUST NOT be enforced by both Istio and
Cilium; ADR-0009, point 2). On every path between plane namespaces the L7 owner is the mesh: the
destination's Envoy sidecar, recorded per path as ztd.facis.io/l7-owner on the umbrella's
NetworkPolicy pair and on the allow rule allow-<name> of this chart. A Cilium policy with L7 rules
would add a second L7 decision point on such a path, whoever applies it (by hand, or another
release). This policy refuses it at admission.

Match: CiliumNetworkPolicy in a namespace carrying the plane label (binding <name>, by the same
namespaceSelector as the proxy policy), and every CiliumClusterwideNetworkPolicy (binding
<name>-clusterwide): a cluster-wide policy has no namespace and can select plane pods through its
endpointSelector, and the zone has no legitimate cluster-wide L7 rule. Each binding names its one
resource in matchResources, since a namespaceSelector never excludes a cluster-scoped object.

Refused, in spec and in every entry of specs, for ingress, egress, ingressDeny and egressDeny:
toPorts[].rules.http, .kafka, .l7 and .l7proto. These are the L7 rule kinds of the Cilium CRDs
(cilium.io/v2 PortRule.rules, L7Rules): 1.19.6, the zones' version, defines dns, http, kafka, l7 and
l7proto; 1.20.2, the pinned CILIUM_CRDS_VERSION, defines dns and http only (the others are not in
its schema and never reach this policy). The deny directions carry no rules in either version and
are checked all the same. Admitted: rules.dns. DNS goes to the cluster resolver in plaintext, outside
the mesh, on a path whose L7 owner is none, so a DNS-aware rule adds no second decision point on a
meshed path (and ZT-26 keeps that bypass). The CEL guards every optional field with has(), so a
policy without toPorts or rules is admitted. failurePolicy Fail: a rule the API server cannot
evaluate refuses the policy. Existing objects are not acted on, only their updates.
*/ -}}
{{- $l := .Values.l7OwnerPolicy }}
{{- if $l.enabled }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $l.name }}
  labels:
    {{- include "zone-policy.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["cilium.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ciliumnetworkpolicies", "ciliumclusterwidenetworkpolicies"]
  variables:
    - name: specs
      expression: >-
        (has(object.spec) ? [object.spec] : []) + (has(object.specs) ? object.specs : [])
  validations:
{{- range $kind := list "http" "kafka" "l7" "l7proto" }}
    - expression: >-
        !({{ include "zone-policy.ciliumL7Rule" $kind | nindent 10 | trim }})
      message: >-
        {{ $l.name }}: a Cilium policy in a plane namespace, or cluster-wide, may not carry an L7 rule:
        found toPorts[].rules.{{ $kind }}. The L7 owner of the plane namespaces' paths is the mesh's
        sidecar (ztd.facis.io/l7-owner, docs/architecture.md section 6); a Cilium L7 rule would be a
        second L7 decision point on the same path. Cilium policies stay L3/L4 here; rules.dns is
        admitted.
      reason: Forbidden
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $l.name }}
  labels:
    {{- include "zone-policy.labels" . | nindent 4 }}
spec:
  policyName: {{ $l.name }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: {{ .Values.registration.planeLabel }}
          operator: Exists
    resourceRules:
      - apiGroups: ["cilium.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ciliumnetworkpolicies"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $l.name }}-clusterwide
  labels:
    {{- include "zone-policy.labels" . | nindent 4 }}
spec:
  policyName: {{ $l.name }}
  validationActions: [Deny]
  matchResources:
    resourceRules:
      - apiGroups: ["cilium.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ciliumclusterwidenetworkpolicies"]
{{- end }}
