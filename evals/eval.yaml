# Created by ops-eval — review me.
# L1 checks render charts and read docs. L2 checks need the local kind cluster `kind-ztd`
# (scripts/dev/kind-cilium-up.sh) with Cilium only: setup installs the zone with
# scripts/install-zone/install.sh (and exercises a failing step, a second run, an uninstall and
# a failing identity check), deploys the eval's own stand-in pods, and teardown uninstalls it again.
# If the cluster is unreachable or not empty, setup installs nothing and the L2 checks exit 77.
# Set ZTD_EVAL_LIVE=0 in the environment to skip the cluster entirely.
timeout: 300
setup: bash ./evals/setup.sh
teardown: bash ./evals/teardown.sh
